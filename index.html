<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Your Seat</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #791010;
      font-family: 'Playfair Display', serif;
      color: #EFE3D0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 1em;
    }

    .search-bar {
      display: flex;
      border: 2px solid #EFE3D0;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 1em;
    }

    .search-bar input {
      flex: 1;
      padding: 0.8em;
      font-size: 1em;
      border: none;
      outline: none;
      background-color: #EFE3D0;
      color: #791010;
    }

    .search-bar button {
      padding: 0.8em 1em;
      background-color: #EFE3D0;
      color: #791010;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .search-bar button:hover {
      background-color: #e0d4b5;
    }

    #result {
      font-size: 1.2em;
      margin-top: 1em;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }

      .search-bar input, .search-bar button {
        padding: 0.6em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Find Where You're Sitting</h1>
    <div class="search-bar">
      <input type="text" id="nameInput" placeholder="Enter your name..." />
      <button onclick="searchName()">Search</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    // 🔒 Hardcoded name -> seat mapping
    const seatMap = {
      "alice": "Row A3",
      "bob": "Row B1",
      "charlie": "Row C2",
      "diana": "Row D4",
      "emma": "Row E1"
      // ➕ Add more here as needed
    };

    function searchName() {
      const input = document.getElementById("nameInput").value.trim().toLowerCase();
      const resultDiv = document.getElementById("result");

      if (input === "") {
        resultDiv.textContent = "Please enter a name.";
        return;
      }

      if (seatMap[input]) {
        resultDiv.textContent = `${capitalize(input)} is sitting in ${seatMap[input]}`;
      } else {
        resultDiv.textContent = "Name not found.";
      }
    }

    function capitalize(name) {
      return name.charAt(0).toUpperCase() + name.slice(1);
    }
  </script>
</body>
</html>
